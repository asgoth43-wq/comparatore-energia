<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparatore Offerte Energia</title>
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #28a745;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background-color: #ddd;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border-top: 5px solid var(--primary);
        }

        .card h3 {
            margin-top: 0;
            color: var(--primary);
        }

        .price-tag {
            font-size: 22px;
            font-weight: bold;
            color: var(--secondary);
            margin: 10px 0;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn-action:hover {
            background-color: #003d80;
        }

        .btn-breakdown {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
            padding: 0;
            text-align: left;
        }

        .load-more-container {
            text-align: center;
            margin-top: 30px;
        }

        .btn-load-more {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-load-more:hover {
            background-color: #5a6268;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            overflow: auto;
        }

        .modal-content {
            background-color: #fff;
            margin: 4% auto;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 700px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Stile Bolletta Duferco */
        .bill-header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .bill-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .bill-table th, .bill-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .bill-table th {
            background-color: #f8f9fa;
        }

        .bill-total {
            background-color: #e9ecef;
            font-weight: bold;
        }

        .highlight-box {
            background-color: #e7f3fe;
            border-left: 6px solid var(--primary);
            padding: 10px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Comparatore Offerte Luce & Gas</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('residenziale')">Residenziale</button>
        <button class="tab-btn" onclick="switchTab('business')">Business</button>
    </div>

    <div id="offers-grid" class="grid"></div>

    <div class="load-more-container" id="load-more-btn-container" style="display: none;">
        <button class="btn-load-more" onclick="loadMoreOffers()">... Carica altre offerte</button>
    </div>
</div>

<!-- Modal Generale -->
<div id="infoModal" class="modal">
    <div class="modal-content" id="modal-body"></div>
</div>

<script>
// Database simulato delle offerte (Residenziali e Business)
const database = {
    residenziale: [
        { id: 1, nome: "Luce Casa Relax", fornitore: "EneCorp", prezzoKwh: 0.125, prezzoSmc: 0.45, quotaFissa: 9.00, trasporto: 0.035, oneri: 0.028, imposte: 0.015, stimaMensile: 65.50 },
        { id: 2, nome: "Energia Verde Plus", fornitore: "EcoPower", prezzoKwh: 0.130, prezzoSmc: 0.48, quotaFissa: 8.50, trasporto: 0.035, oneri: 0.028, imposte: 0.015, stimaMensile: 68.10 },
        { id: 3, nome: "Flexi Web Casa", fornitore: "NetGas", prezzoKwh: 0.118, prezzoSmc: 0.42, quotaFissa: 12.00, trasporto: 0.035, oneri: 0.028, imposte: 0.015, stimaMensile: 63.80 },
        { id: 4, nome: "Luce Sicura Fix", fornitore: "SicuraEnergia", prezzoKwh: 0.140, prezzoSmc: 0.50, quotaFissa: 7.00, trasporto: 0.035, oneri: 0.028, imposte: 0.015, stimaMensile: 71.00 },
        { id: 5, nome: "Zero Pensieri Family", fornitore: "OmniaLuce", prezzoKwh: 0.122, prezzoSmc: 0.44, quotaFissa: 10.00, trasporto: 0.035, oneri: 0.028, imposte: 0.015, stimaMensile: 66.20 },
        { id: 6, nome: "Smart Green Dual", fornitore: "GreenLife", prezzoKwh: 0.129, prezzoSmc: 0.46, quotaFissa: 9.50, trasporto: 0.035, oneri: 0.028, imposte: 0.015, stimaMensile: 67.90 },
        { id: 7, nome: "Casa Eco Dynamic", fornitore: "EneCorp", prezzoKwh: 0.115, prezzoSmc: 0.41, quotaFissa: 13.00, trasporto: 0.035, oneri: 0.028, imposte: 0.015, stimaMensile: 64.00 },
        { id: 8, nome: "Luce Night & Weekend", fornitore: "EcoPower", prezzoKwh: 0.120, prezzoSmc: 0.43, quotaFissa: 11.00, trasporto: 0.035, oneri: 0.028, imposte: 0.015, stimaMensile: 65.00 }
    ],
    business: [
        { id: 101, nome: "Impresa Power Pro", fornitore: "EneCorp Business", prezzoKwh: 0.145, prezzoSmc: 0.52, quotaFissa: 18.00, trasporto: 0.030, oneri: 0.025, imposte: 0.020, stimaMensile: 240.00 },
        { id: 102, nome: "Business Green Flat", fornitore: "EcoPower Biz", prezzoKwh: 0.150, prezzoSmc: 0.55, quotaFissa: 15.00, trasporto: 0.030, oneri: 0.025, imposte: 0.020, stimaMensile: 252.00 },
        { id: 103, nome: "P.IVA Dynamic XL", fornitore: "NetGas Trade", prezzoKwh: 0.138, prezzoSmc: 0.49, quotaFissa: 22.00, trasporto: 0.030, oneri: 0.025, imposte: 0.020, stimaMensile: 235.00 },
        { id: 104, nome: "Azienda Continua", fornitore: "SicuraEnergia Biz", prezzoKwh: 0.160, prezzoSmc: 0.58, quotaFissa: 12.00, trasporto: 0.030, oneri: 0.025, imposte: 0.020, stimaMensile: 268.00 },
        { id: 105, nome: "Retail Flex", fornitore: "OmniaLuce Trade", prezzoKwh: 0.142, prezzoSmc: 0.51, quotaFissa: 20.00, trasporto: 0.030, oneri: 0.025, imposte: 0.020, stimaMensile: 242.00 },
        { id: 106, nome: "Corporate Sustainability", fornitore: "GreenLife Biz", prezzoKwh: 0.148, prezzoSmc: 0.53, quotaFissa: 16.00, trasporto: 0.030, oneri: 0.025, imposte: 0.020, stimaMensile: 248.00 },
        { id: 107, nome: "Industry Heavy Direct", fornitore: "EneCorp Business", prezzoKwh: 0.135, prezzoSmc: 0.48, quotaFissa: 25.00, trasporto: 0.030, oneri: 0.025, imposte: 0.020, stimaMensile: 230.00 }
    ]
};

let currentTab = 'residenziale';
let visibleCount = 6;

function switchTab(tab) {
    currentTab = tab;
    visibleCount = 6;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderOffers();
}

function renderOffers() {
    const grid = document.getElementById('offers-grid');
    grid.innerHTML = '';
    const items = database[currentTab].slice(0, visibleCount);

    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div>
                <small>${item.fornitore}</small>
                <h3>${item.nome}</h3>
                <div class="price-tag">~ €${item.stimaMensile.toFixed(2)} / mese</div>
                <p><strong>Corrispettivo Luce:</strong> €${item.prezzoKwh.toFixed(3)} / kWh</p>
                <p><strong>Corrispettivo Gas:</strong> €${item.prezzoSmc.toFixed(2)} / Smc</p>
            </div>
            <div>
                <button class="btn-breakdown" onclick="openScontrino(${item.id})">Scontrino Dell'Energia Spiegato Per Ogni Singola Voce</button>
                <button class="btn-action" onclick="openPreventivo(${item.id})">Vedi Preventivo Dettagliato</button>
            </div>
        `;
        grid.appendChild(card);
    });

    const loadMoreBtn = document.getElementById('load-more-btn-container');
    if (visibleCount < database[currentTab].length) {
        loadMoreBtn.style.display = 'block';
    } else {
        loadMoreBtn.style.display = 'none';
    }
}

function loadMoreOffers() {
    visibleCount += 6;
    renderOffers();
}

function openScontrino(id) {
    const offer = findOffer(id);
    const modalBody = document.getElementById('modal-body');
    
    modalBody.innerHTML = `
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2>Scontrino Dell'Energia Spiegato Per Ogni Singola Voce</h2>
        <p>Dettaglio trasparente della struttura di costo per l'offerta <strong>${offer.nome}</strong> (${offer.fornitore}):</p>
        
        <ul>
            <li><strong>Spesa Materia Energia/Gas:</strong> Include il costo d'acquisto della materia prima (€${offer.prezzoKwh}/kWh) e la commercializzazione fissa (€${offer.quotaFissa.toFixed(2)}/mese).</li>
            <li><strong>Trasporto e Gestione Contatore:</strong> Copre le spese di trasmissione dell'energia sulla rete nazionale e la lettura dei consumi (€${offer.trasporto}/kWh).</li>
            <li><strong>Oneri di Sistema:</strong> Costi stabiliti per legge per il sostegno alle energie rinnovabili e gli incentivi di settore (€${offer.oneri}/kWh).</li>
            <li><strong>Imposte e IVA:</strong> Accise erariali e IVA applicata al totale dei consumi.</li>
        </ul>
    `;
    document.getElementById('infoModal').style.display = 'block';
}

function openPreventivo(id) {
    const offer = findOffer(id);
    const modalBody = document.getElementById('modal-body');
    
    // Calcolo consumi stimati su base mensile media (es. 150 kWh/mese)
    const kwhStimati = 150;
    const costoMateria = (kwhStimati * offer.prezzoKwh) + offer.quotaFissa;
    const costoTrasporto = kwhStimati * offer.trasporto;
    const costoOneri = kwhStimati * offer.oneri;
    const subtotale = costoMateria + costoTrasporto + costoOneri;
    const imposteVal = kwhStimati * offer.imposte;
    const totaleBolletta = subtotale + imposteVal;
    const prezzoMedioKwh = totaleBolletta / kwhStimati;

    modalBody.innerHTML = `
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="bill-header">
            <h2>Prospetto Analitico Preventivo</h2>
            <p><strong>Offerta:</strong> ${offer.nome} | <strong>Fornitore:</strong> ${offer.fornitore}</p>
        </div>

        <div class="highlight-box">
            <strong>Prezzo Medio Ponderato Stimato:</strong> €${prezzoMedioKwh.toFixed(3)} / kWh
        </div>

        <h3>Simulazione Bolletta Mensile (Consumo tipo: ${kwhStimati} kWh)</h3>
        <table class="bill-table">
            <thead>
                <tr>
                    <th>Voce di Spesa</th>
                    <th>Dettaglio Calcolo</th>
                    <th>Importo (€)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Spesa per la Materia Energia</td>
                    <td>(${kwhStimati} kWh × €${offer.prezzoKwh}) + €${offer.quotaFissa.toFixed(2)} fisso</td>
                    <td>€${costoMateria.toFixed(2)}</td>
                </tr>
                <tr>
                    <td>Spesa Trasporto e Gestione Contatore</td>
                    <td>${kwhStimati} kWh × €${offer.trasporto}</td>
                    <td>€${costoTrasporto.toFixed(2)}</td>
                </tr>
                <tr>
                    <td>Spesa Oneri di Sistema</td>
                    <td>${kwhStimati} kWh × €${offer.oneri}</td>
                    <td>€${costoOneri.toFixed(2)}</td>
                </tr>
                <tr>
                    <td>Imposte e Accise</td>
                    <td>${kwhStimati} kWh × €${offer.imposte}</td>
                    <td>€${imposteVal.toFixed(2)}</td>
                </tr>
                <tr class="bill-total">
                    <td colspan="2">TOTALE STIMATO BOLLETTA (IVA Incl.)</td>
                    <td>€${totaleBolletta.toFixed(2)}</td>
                </tr>
            </tbody>
        </table>
    `;
    document.getElementById('infoModal').style.display = 'block';
}

function findOffer(id) {
    return database.residenziale.find(o => o.id === id) || database.business.find(o => o.id === id);
}

function closeModal() {
    document.getElementById('infoModal').style.display = 'none';
}

window.onclick = function(event) {
    const modal = document.getElementById('infoModal');
    if (event.target == modal) {
        modal.style.display = "none";
    }
}

// Inizializzazione
renderOffers();
</script>

</body>
</html>
